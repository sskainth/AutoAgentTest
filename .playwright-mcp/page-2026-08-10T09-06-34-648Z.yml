        - list [ref=e199]:
          - listitem [ref=e200]:
            - paragraph [ref=e201]: "01"
            - heading "Search without an account" [level=3] [ref=e202]
            - paragraph [ref=e203]: Every listing, filter and salary range is open before you sign up. You only need an account to apply.
          - listitem [ref=e204]:
            - paragraph [ref=e205]: "02"
            - heading "Apply with one profile" [level=3] [ref=e206]
            - paragraph [ref=e207]: Your profile, portfolio and verified history go with every application. No re-typing the same three jobs into a fourth form.
          - listitem [ref=e208]:
            - paragraph [ref=e209]: "03"
            - heading "Agree the terms in writing" [level=3] [ref=e210]
            - paragraph [ref=e211]: Scope, rate, dates and milestones become a contract both sides sign. Changes need both signatures again.
          - listitem [ref=e212]:
            - paragraph [ref=e213]: "04"
            - heading "Work against milestones" [level=3] [ref=e214]
            - paragraph [ref=e215]: Each milestone is funded before you start it. You can see the money is there, and so can the client.
          - listitem [ref=e216]:
            - paragraph [ref=e217]: "05"
            - heading "Get paid on approval" [level=3] [ref=e218]
            - paragraph [ref=e219]: Approval releases the milestone. If there is a disagreement, a dispute process handles it instead of an email thread.
