              - heading "The money is held before the work starts" [level=3] [ref=e325]
              - paragraph [ref=e326]: A client funds a milestone up front. It sits in escrow, visible to both sides, and releases when the milestone is approved. If something goes wrong there is a dispute process rather than a chase.
              - paragraph [ref=e327]: The platform takes 7% in total, split 2% from the client and 5% from the freelancer. That is the whole fee, and it is the same for everyone.
              - link "How escrow works" [ref=e328] [cursor=pointer]:
                - /url: /features
          - article [ref=e331]:
            - img [ref=e334]:
              - generic [ref=e366]: Checked by the issuer, not by the applicant
            - generic [ref=e367]:
              - paragraph [ref=e368]: Proving experience
              - heading "History that someone else confirmed" [level=3] [ref=e369]
              - paragraph [ref=e370]: Completed work, references and qualifications can be issued as verifiable credentials by the party that can actually vouch for them. A recruiter sees who confirmed it, not just what was claimed.
              - paragraph [ref=e371]: Built on the W3C Verifiable Credentials standard, so a credential you earn here stays checkable if you take it elsewhere.
              - link "See the work passport" [ref=e372] [cursor=pointer]:
                - /url: /passport
