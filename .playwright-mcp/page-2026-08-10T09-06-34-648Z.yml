          - heading "One record from the search result to the payout" [level=2] [ref=e134]
          - paragraph [ref=e135]: Most platforms hand you off at the point of application and leave the contract and the invoice to you. Here it is the same thread the whole way, which is what makes the payment guarantee possible at all.
