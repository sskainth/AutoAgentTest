              - paragraph [ref=e415]: Matching
              - heading "A ranking that tells you why" [level=3] [ref=e416]
              - paragraph [ref=e417]: Candidates and roles are scored on skills, availability and the requirements actually written in the posting. Every score opens into the reasons behind it, and a recruiter can disagree with it.
              - paragraph [ref=e418]: No emotion or personality inference, ever. That is prohibited in hiring under the EU AI Act, and a test fails our build if the code drifts towards it. Gaddr is a provider of these systems under Article 16, not only a deployer.
